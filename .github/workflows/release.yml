name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Detect version bump
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD^:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PREV" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION unchanged since previous commit"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version bumped ${PREV:-none} -> $VERSION"
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

      - run: pnpm run build:package

      - run: pnpm run zip
      - run: pnpm run zip:firefox

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}+$(date -u '+%Y%m%d.%H%M%S')"
          CHROME_ZIP=$(ls .output/*-chrome.zip)
          FIREFOX_ZIP=$(ls .output/*-firefox.zip)
          gh release create "$TAG" "$CHROME_ZIP" "$FIREFOX_ZIP" \
            --title "$TAG" \
            --notes "Built from $(git rev-parse --short HEAD)" \
            --latest

      - name: Update stable download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHROME_ZIP=$(ls .output/*-chrome.zip)
          FIREFOX_ZIP=$(ls .output/*-firefox.zip)
          cp "$CHROME_ZIP" .output/csm-dev-wallet.zip
          cp "$FIREFOX_ZIP" .output/csm-dev-wallet-firefox.zip
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            .output/csm-dev-wallet.zip \
            .output/csm-dev-wallet-firefox.zip \
            --title "Latest (v${VERSION})" \
            --notes "Always points to the latest build. [Chrome](https://github.com/exromany/csm-dev-wallet/releases/download/latest/csm-dev-wallet.zip) · [Firefox](https://github.com/exromany/csm-dev-wallet/releases/download/latest/csm-dev-wallet-firefox.zip)" \
            --prerelease

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "csm-dev-wallet@${VERSION}" version 2>/dev/null; then
            echo "v${VERSION} already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Submit to Chrome Web Store
        if: steps.version.outputs.bumped == 'true'
        run: npx publish-extension --chrome-zip "$(ls .output/*-chrome.zip)"
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
